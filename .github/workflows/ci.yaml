name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate application modules
        env:
          GOOGLE_API_KEY: "dummy-key-for-ci"
          TAVILY_API_KEY: "dummy-key-for-ci"
        run: |
          python -c "import rag, agent, tools, database, security, app; print('All core modules validated successfully!')"

      - name: Test Docker build
        run: |
          docker build -t jarvis .
